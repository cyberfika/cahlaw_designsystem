<!doctype html>
<html>
<head><meta charset="utf-8"><title>Capa — preview</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  html, body { margin: 0; background: transparent; }
  .stages { display: flex; flex-direction: column; gap: 12px; }
  .stage { position: relative; overflow: hidden; }
  .stage > .cah-slide { transform-origin: 0 0; }
</style></head>
<body>
<div class="stages">
<div class="stage"><section class="cah-slide cah-capa" data-theme="escuro">
    <img class="cah-aguia" src="../../assets/Imagens/aguia-faixa-capa.png" alt="">
    <img class="cah-capa__logo" src="../../assets/Logotipos/cah-sigla-negativo.svg" alt="CAH Law">
    <img class="cah-capa__selo" src="../../assets/Logotipos/cah-selo-10anos.svg" alt="10 anos">
  </section></div>
<div class="stage"><section class="cah-slide cah-capa cah-capa--completo" data-theme="escuro">
    <img class="cah-aguia" src="../../assets/Imagens/aguia-faixa-capa.png" alt="">
    <img class="cah-capa__logo" src="../../assets/Logotipos/cah-completo-negativo.svg" alt="Carneiro &amp; Hannemann Law">
    <img class="cah-capa__selo" src="../../assets/Logotipos/cah-selo-10anos.svg" alt="10 anos">
  </section></div>
</div>
<script>
  function fit() {
    document.querySelectorAll('.stage').forEach(function (st) {
      var k = st.parentNode.clientWidth / 1920, s = st.firstElementChild;
      s.style.transform = 'scale(' + k + ')';
      st.style.height = Math.round(1080 * k) + 'px';
    });
  }
  fit(); addEventListener('resize', fit);
</script>
</body>
</html>
